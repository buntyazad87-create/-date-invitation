<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff0f5">
<title>A Little Question 💕</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;min-height:100dvh;padding:18px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff7fa,#ffe8ef 55%,#fff4f7);
  color:#351b26;overflow:hidden;
}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-30px;opacity:.3;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

.card{
  width:min(100%,430px);height:min(720px,calc(100dvh - 36px));
  min-height:560px;padding:34px 24px;
  background:rgba(255,255,255,.95);border-radius:32px;
  box-shadow:0 22px 65px rgba(100,35,60,.14);
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;text-align:center;
}
.screen{width:100%}.hidden{display:none!important}
.emoji{font-size:58px;line-height:1;margin-bottom:22px}
h1{margin:0 0 14px;font-size:clamp(30px,8vw,40px);line-height:1.12}
p{margin:0 auto 28px;max-width:350px;color:#795965;font-size:18px;line-height:1.5}

/* The two buttons have their own area, so they can never overlap on load. */
.question-buttons{
  position:relative;width:100%;height:150px;margin:0 auto;
}
.main-btn{
  width:140px;height:58px;border:0;border-radius:19px;
  font:inherit;font-size:18px;font-weight:750;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.yes{
  position:absolute;left:50%;top:20px;
  transform:translateX(calc(-100% - 8px));
  background:#ff4f7b;color:#fff;
  box-shadow:0 10px 24px rgba(255,79,123,.28);
}
.no{
  position:absolute;left:calc(50% + 8px);top:20px;
  background:#f2e9ed;color:#684955;
  box-shadow:0 8px 20px rgba(80,30,50,.08);
}
.hint{margin-top:-5px;color:#a0838d;font-size:14px}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.choice{
  min-height:78px;border:2px solid #f1dce4;border-radius:18px;
  background:#fff;color:#4b2834;font:inherit;font-size:17px;font-weight:650;
  box-shadow:0 7px 18px rgba(90,30,50,.06)
}
.choice.selected{border-color:#ff4f7b;background:#fff0f4;transform:scale(1.02)}
.continue,.whatsapp,.restart{
  width:100%;min-height:56px;border:0;border-radius:18px;
  font:inherit;font-size:17px;font-weight:750;cursor:pointer
}
.continue{background:#ff4f7b;color:white}
.continue:disabled{opacity:.45}
.date{
  width:100%;height:58px;padding:0 16px;margin-bottom:18px;
  border:2px solid #f1dce4;border-radius:17px;background:white;
  font:inherit;font-size:17px;color:#351b26
}
.success{font-size:76px;line-height:1;margin-bottom:18px}
.summary{padding:16px 18px;margin:14px 0 22px;border-radius:18px;background:#fff2f6;text-align:left;line-height:1.9}
.whatsapp{background:#25d366;color:white}
.restart{margin-top:10px;background:#f2e9ed;color:#684955}

@media(max-height:650px){
  .card{min-height:500px;padding:26px 20px}
  .emoji{font-size:48px;margin-bottom:14px}
  p{margin-bottom:18px}
  .question-buttons{height:125px}
}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>

<main class="card">

<section id="screen1" class="screen">
  <div class="emoji">💌</div>
  <h1>Hey, I have a little question...</h1>
  <p>Would you like to go on a date with me? 👀❤️</p>

  <div class="question-buttons" id="questionArea">
    <button class="main-btn yes" id="yesButton" type="button">YES ❤️</button>
    <button class="main-btn no" id="noButton" type="button">NO 😏</button>
  </div>

  <div class="hint">Choose wisely 😌</div>
</section>

<section id="screen2" class="screen hidden">
  <div class="emoji">🍽️</div>
  <h1>It's a date! ❤️</h1>
  <p>Now the important question... what are we eating?</p>
  <div class="choice-grid">
    <button class="choice" type="button" data-food="Pizza 🍕">Pizza 🍕</button>
    <button class="choice" type="button" data-food="Burger 🍔">Burger 🍔</button>
    <button class="choice" type="button" data-food="Pasta 🍝">Pasta 🍝</button>
    <button class="choice" type="button" data-food="You choose 😌">You choose 😌</button>
  </div>
  <button class="continue" id="foodNext" type="button" disabled>Continue →</button>
</section>

<section id="screen3" class="screen hidden">
  <div class="emoji">📅</div>
  <h1>Pick the date 💕</h1>
  <p>When should we make it official?</p>
  <input class="date" id="dateInput" type="date">
  <button class="continue" id="dateNext" type="button">Continue →</button>
</section>

<section id="screen4" class="screen hidden">
  <div class="success">🥰</div>
  <h1>IT'S A DATE! ❤️</h1>
  <p>Okay, now there's no backing out. 😌</p>
  <div class="summary">
    <b>Food:</b> <span id="foodResult"></span><br>
    <b>Date:</b> <span id="dateResult"></span>
  </div>
  <button class="whatsapp" id="sendButton" type="button">Send my answer 💌</button>
  <div id="sendStatus" style="margin-top:12px;font-size:14px;color:#795965"></div>
  <button class="restart" id="restartButton" type="button">Start over</button>
</section>

</main>

<script>
(function(){
  "use strict";

  const s1=document.getElementById("screen1");
  const s2=document.getElementById("screen2");
  const s3=document.getElementById("screen3");
  const s4=document.getElementById("screen4");
  const yes=document.getElementById("yesButton");
  const no=document.getElementById("noButton");
  const area=document.getElementById("questionArea");
  const foodNext=document.getElementById("foodNext");
  const dateInput=document.getElementById("dateInput");
  let food="";

  function show(screen){
    [s1,s2,s3,s4].forEach(x=>x.classList.add("hidden"));
    screen.classList.remove("hidden");
  }

  yes.addEventListener("click",function(){
    show(s2);
  });

  function dodge(){
    // Calculate positions using the actual rendered rectangles. This makes
    // sure NO never overlaps YES, including when YES has a CSS transform.
    const areaRect=area.getBoundingClientRect();
    const yesRect=yes.getBoundingClientRect();
    const noW=no.offsetWidth;
    const noH=no.offsetHeight;
    const gap=14;
    const maxX=Math.max(0,area.clientWidth-noW);
    const maxY=Math.max(0,area.clientHeight-noH);

    const forbidden={
      left:yesRect.left-areaRect.left-gap,
      right:yesRect.right-areaRect.left+gap,
      top:yesRect.top-areaRect.top-gap,
      bottom:yesRect.bottom-areaRect.top+gap
    };

    const candidates=[];
    for(let i=0;i<100;i++){
      const x=Math.random()*maxX;
      const y=Math.random()*maxY;
      const overlaps=x<forbidden.right && x+noW>forbidden.left &&
                     y<forbidden.bottom && y+noH>forbidden.top;
      if(!overlaps)candidates.push({x,y});
    }

    if(candidates.length){
      const pick=candidates[Math.floor(Math.random()*candidates.length)];
      no.style.left=Math.round(pick.x)+"px";
      no.style.top=Math.round(pick.y)+"px";
      return;
    }

    // Fallback for unusually small screens: place NO fully to one side.
    const leftX=Math.max(0,Math.min(maxX,forbidden.left-noW));
    const rightX=Math.max(0,Math.min(maxX,forbidden.right));
    const x=(rightX+noW<=maxX ? rightX : leftX);
    no.style.left=Math.round(x)+"px";
    no.style.top=Math.round(Math.min(maxY,Math.max(0,Math.random()*maxY)))+"px";
  }

  no.addEventListener("pointerdown",function(e){
    e.preventDefault();
    dodge();
  });
  no.addEventListener("pointerenter",dodge);

  document.querySelectorAll(".choice").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      food=btn.dataset.food;
      foodNext.disabled=false;
    });
  });

  foodNext.addEventListener("click",function(){
    if(food)show(s3);
  });

  const today=new Date();
  today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
  dateInput.min=today.toISOString().slice(0,10);

  document.getElementById("dateNext").addEventListener("click",function(){
    if(!dateInput.value){dateInput.focus();return}
    const d=new Date(dateInput.value+"T00:00:00");
    document.getElementById("foodResult").textContent=food;
    document.getElementById("dateResult").textContent=d.toLocaleDateString(undefined,{
      weekday:"long",month:"long",day:"numeric"
    });
    show(s4);
    confetti();
  });

  document.getElementById("sendButton").addEventListener("click",function(){
    // GitHub Pages is static, so private delivery needs a form endpoint.
    // Put your Formspree endpoint here after creating the form.
    const endpoint="YOUR_PRIVATE_FORM_ENDPOINT";
    const status=document.getElementById("sendStatus");

    if(endpoint.includes("YOUR_PRIVATE_FORM_ENDPOINT")){
      status.textContent="Your answer is ready ❤️ (private sending needs to be connected).";
      return;
    }

    const data=new FormData();
    data.append("subject","Date invitation response ❤️");
    data.append("food",food);
    data.append("date",document.getElementById("dateResult").textContent);
    data.append("message","She said YES! ❤️\nFood: "+food+"\nDate: "+document.getElementById("dateResult").textContent);

    const button=this;
    button.disabled=true;
    button.textContent="Sending…";
    fetch(endpoint,{method:"POST",body:data,headers:{"Accept":"application/json"}})
      .then(function(r){
        if(!r.ok)throw new Error("send failed");
        status.textContent="Sent privately to you ❤️";
        button.textContent="Sent ❤️";
      })
      .catch(function(){
        status.textContent="Could not send right now. Please try again.";
        button.disabled=false;
        button.textContent="Send my answer 💌";
      });
  });

  document.getElementById("restartButton").addEventListener("click",function(){
    food="";
    dateInput.value="";
    document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
    foodNext.disabled=true;
    document.getElementById("sendButton").disabled=false;
    document.getElementById("sendButton").textContent="Send my answer 💌";
    document.getElementById("sendStatus").textContent="";
    no.style.left="calc(50% + 8px)";
    no.style.top="20px";
    show(s1);
  });

  function confetti(){
    const symbols=["❤️","💕","✨","🎉"];
    for(let i=0;i<35;i++){
      const p=document.createElement("div");
      p.textContent=symbols[i%4];
      p.style.cssText="position:fixed;left:"+Math.random()*100+"vw;top:"+Math.random()*70+
        "vh;font-size:"+(16+Math.random()*20)+"px;z-index:50;pointer-events:none;animation:pop 1.5s ease-out forwards";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1600);
    }
  }

  const style=document.createElement("style");
  style.textContent="@keyframes pop{0%{transform:translateY(30px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) rotate(300deg);opacity:0}}";
  document.head.appendChild(style);

  const hearts=document.getElementById("hearts");
  for(let i=0;i<16;i++){
    const h=document.createElement("span");
    h.className="heart";h.textContent="♥";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDelay=Math.random()*7+"s";
    h.style.animationDuration=(5+Math.random()*5)+"s";
    hearts.appendChild(h);
  }
})();
</script>
</body>
</html>
